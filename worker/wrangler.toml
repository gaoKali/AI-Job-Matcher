name = "ai-job-matcher-api"
main = "index.mjs"
compatibility_date = "2026-10-04"
workers_dev = true
keep_vars = true

[vars]
AI_MODEL = "qwen3.8-flash"
# AI_BASE_URL is managed in the dashboard and preserved by keep_vars.
# Never overwrite the user's configured workspace URL with an empty local value.
AI_DISABLE_THINKING = "true"
# Only local preview is permitted until the final public origin is known.
ALLOWED_ORIGINS = "http://127.0.0.1,http://localhost,http://127.0.0.1:4173,http://localhost:4173"
# AI_API_KEY must be a Cloudflare Secret; never put it here.

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
