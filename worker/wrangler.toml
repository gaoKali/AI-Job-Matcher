name = "ai-job-matcher-api"
main = "index.mjs"
compatibility_date = "2026-10-04"
workers_dev = true
keep_vars = true

[vars]
PUBLIC_AI_ENABLED = "true"
FREE_PUBLIC_MODE = "true"
# Dashboard-managed quota variables; preserved by keep_vars=true.
# IP_MINUTE_AI_LIMIT / IP_DAILY_AI_LIMIT / DAILY_AI_GLOBAL_LIMIT
# Set TURNSTILE_SITE_KEY in dashboard after creating the Widget (public key).
# TURNSTILE_SECRET_KEY is a Secret only; never put it in a file.
FREE_MODE = "true"
WEBSEARCH_ENABLED = "false"
JOBS_ENABLED = "false"
# FREE_MODE uses the global durable 1500-call safety budget; never resets on deploy.
AI_MODEL = "qwen3.8-flash"
# AI_BASE_URL is managed in the dashboard and preserved by keep_vars.
# Never overwrite the user's configured workspace URL with an empty local value.
AI_DISABLE_THINKING = "true"
# Exact public Pages origin plus local preview; never wildcard.
ALLOWED_ORIGINS = "https://gaokali.github.io,http://127.0.0.1,http://localhost,http://127.0.0.1:4173,http://localhost:4173"
# AI_API_KEY must be a Cloudflare Secret; never put it here.

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[[durable_objects.bindings]]
name = "SEARCH_BUDGET"
class_name = "SearchBudget"

[[migrations]]
tag = "search-budget-v1"
new_sqlite_classes = ["SearchBudget"]

# Public company jobs only; no resume, profile or personal result is stored.
[[durable_objects.bindings]]
name = "COMPANY_JOB_POOL"
class_name = "CompanyJobPool"

[[migrations]]
tag = "company-pool-v1"
new_sqlite_classes = ["CompanyJobPool"]

# Atomic anonymous AI quotas using Free SQLite Durable Objects.
[[durable_objects.bindings]]
name = "AI_USAGE"
class_name = "AIUsage"

[[migrations]]
tag = "public-ai-usage-v1"
new_sqlite_classes = ["AIUsage"]
